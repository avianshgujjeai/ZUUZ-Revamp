project:
  name: "ZUUZ"
  tagline: "Turn customer emails into closed sales"
  description: >
    ZUUZ is an AI sales-inbox agent. It reads every inbound email in a sales mailbox,
    extracts buying signals (source, intent, urgency, industry, budget, requester, ask),
    qualifies the lead as the conversation progresses, drafts the reply, matches RFPs
    against the customer's product catalog, and writes pipeline back to Salesforce,
    HubSpot, or Zoho — with an audit trail on every AI action and human approval gates
    by default.
  website: "https://zuuz.ai"
  target_audience:
    primary: "B2B sales leaders and founders running inbound-heavy sales motions"
    secondary: "Sales ops, CRM admins, and revenue leaders in distribution, IT services, and retail distribution"
    technical_level: "mixed"

# Author — Avinash is the founder voice and origin-story spine of the brand
author:
  name: "Avinash Gujje"
  title: "Founder & CEO, ZUUZ"
  bio: >
    Built Cloud Box Technologies from $0 to $25M ARR. Spent ten years watching CRM
    run two weeks behind reality. Founded ZUUZ to fix it.
  website: "https://zuuz.ai"
  social_links:
    email: "hello@zuuz.ai"

