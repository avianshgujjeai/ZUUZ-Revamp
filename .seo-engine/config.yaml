  - name: "Regie.ai"
    website: "https://www.regie.ai"
    id: "comp_regie"
    category: "AI BDR / sales agent"
    why_listed: "AI BDR with sourcing + outreach. Buyers compare on agent quality."
  - name: "HubSpot Sales Hub"
    website: "https://www.hubspot.com/products/sales"
    id: "comp_hubspot_sales"
    category: "Incumbent CRM with AI"
    why_listed: "SMB buyers default to HubSpot. ZUUZ writes into HubSpot — comparison is about replacement vs augmentation."
