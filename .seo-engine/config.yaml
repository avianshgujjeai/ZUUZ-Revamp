# CMS — unknown without codebase access. Defaults below are reasonable guesses.
# Update once you confirm the actual stack.
cms:
  type: "static-html"   # detected: flat static HTML (no framework), Vercel-deployed with cleanUrls
  blog_directory: "/blog"          # recommended path; no blog exists today (create as /blog/{slug}.html, or move to a framework first)
  docs_directory: ""               # ZUUZ has no public docs site yet
  frontmatter_format: "yaml"
  date_format: "YYYY-MM-DD"
  slug_style: "kebab-case"
  slug_max_words: 5
  image_directory: "/public/images/blog"
  frontmatter_schema:
    required:
      - title
      - description
      - date
      - author
    optional:
      - tags
      - category
      - image
      - canonical
      - draft

