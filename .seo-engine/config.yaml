seo:
  primary_topics:
    - "AI sales inbox"
    - "email to CRM"
    - "RFP automation"
    - "inbound lead qualification"
    - "AI sales agent"
    - "SKU matching for distributors"
    - "audit trail for AI sales agents"

  brand_terms:
    - "ZUUZ"
    - "zuuz.ai"
    - "zuuz ai"
    - "ZUUZ AI"

  # Avoid SERPs owned by 9-figure-ARR incumbents — not worth fighting
  avoid_terms:
    - "outbound prospecting"
    - "cold email tool"
    - "email marketing"
    - "sales automation software"  # too broad, owned by HubSpot/Apollo/ZoomInfo
    - "best CRM"

  target_regions:
    - "United States"
    - "United Arab Emirates"
    - "India"
  language: "en"

content:
  min_word_count: 1500
  max_word_count: 4000
  default_author: "Avinash Gujje"
  tone: "founder voice, opinionated, anti-fluff, specific. Avoids generic SaaS tone."
  include_faq: true
  include_toc: true
  cta_text: "Book a 15-min demo"
  cta_url: "https://cal.com/avinashgujje/15min"
  max_posts_per_month: 4   # realistic cadence for a 3-customer company
  requires_human_review: true

technical_seo:
  meta_description_max_chars: 160
  title_tag_max_chars: 60
  image_alt_text_required: true
  canonical_url_pattern: "https://www.zuuz.ai/blog/{slug}"

integrations:
  seo_tool: "none"     # TODO: connect Ahrefs/Semrush MCP if available
  analytics: "none"    # TODO: set up GA4 + Plausible + Search Console
  search_console: false
